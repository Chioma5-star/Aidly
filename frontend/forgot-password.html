<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Aidly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">💚 Aidly</div>
    <div class="nav-auth">
      <button class="btn-login-outline" onclick="window.location.href='login.html'">Back to Login</button>
    </div>
  </header>

  <main class="container">
    <div class="donation-box" style="max-width: 460px; margin: 60px auto;">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="font-size:48px;">🔐</div>
        <h2 style="margin:8px 0 4px;">Forgot Password?</h2>
        <p style="color:#64748b; font-size:14px;">Enter your email and we'll send you a reset link.</p>
      </div>

      <div id="successMsg" style="display:none; background:#dcfce7; border:1px solid #22c55e; border-radius:10px; padding:14px; margin-bottom:16px; color:#166534; font-size:14px; text-align:center;">
        ✅ If that email exists, a reset link has been sent!
      </div>

      <label style="font-weight:600; font-size:14px; display:block; margin-bottom:6px;">Email Address</label>
      <input type="email" id="resetEmail" placeholder="name@email.com"
        style="width:100%; padding:12px; border-radius:10px; border:1px solid #e2e8f0; font-size:14px; box-sizing:border-box; margin-bottom:16px;">

      <button onclick="sendReset()" id="resetBtn"
        style="width:100%; background:#22c55e; color:white; border:none; padding:14px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;">
        Send Reset Link →
      </button>

      <p style="text-align:center; margin-top:20px; font-size:14px; color:#64748b;">
        Remembered it? <a href="login.html" style="color:#166534; font-weight:600;">Login here</a>
      </p>
    </div>
  </main>

  <script>
    // API_URL is set globally by config.js
const API_URL = window.API_URL || "https://aidly-q8i6.onrender.com/api";

    async function sendReset() {
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) return alert("Please enter your email!");

      const btn = document.getElementById("resetBtn");
      btn.innerText = "Sending..."; btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        document.getElementById("successMsg").style.display = "block";
        btn.innerText = "Sent!";
      } catch (err) {
        toast("Connection error. Is your backend running?", "error");
        btn.innerText = "Send Reset Link →"; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
