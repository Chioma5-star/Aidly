<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Centers - Aidly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS - FREE, no API key needed -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; }
    .maps-nav {
      background: white; padding: 14px 5%; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000;
    }
    .maps-nav .logo { font-size: 22px; font-weight: 800; color: #14532d; }
    .maps-nav .nav-right { display: flex; gap: 10px; align-items: center; }
    .btn-back { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn-logout { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }

    .maps-wrapper { max-width: 1100px; margin: 0 auto; padding: 24px 4%; }

    .role-banner { border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; font-weight: 500; }
    .role-banner.donor { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .role-banner.recipient { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .role-banner.volunteer { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .role-banner.admin { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }

    .page-title { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: #64748b; margin-bottom: 20px; }

    .maps-grid { display: grid; grid-template-columns: 1fr 310px; gap: 18px; margin-bottom: 24px; }

    #map { width: 100%; height: 500px; border-radius: 16px; border: 1px solid #e2e8f0; z-index: 1; }

    .centers-panel { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; max-height: 500px; }
    .centers-header { padding: 14px 18px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    .centers-header h3 { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
    .centers-header p { font-size: 12px; color: #64748b; }
    .centers-list { overflow-y: auto; flex: 1; }

    .center-card { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.15s; }
    .center-card:hover { background: #f0fdf4; }
    .center-card.active { background: #f0fdf4; border-left: 3px solid #14532d; }
    .center-card h4 { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
    .center-card p { font-size: 12px; color: #64748b; margin-bottom: 2px; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 4px; }
    .badge-donation { background: #dbeafe; color: #1d4ed8; }
    .badge-pickup { background: #fef3c7; color: #92400e; }
    .badge-distribution { background: #dcfce7; color: #166534; }
    .empty-panel { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13px; }

    /* Admin form */
    .add-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 22px; }
    .add-card h3 { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .add-card p { font-size: 13px; color: #64748b; margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
    .map-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 13px; font-family: 'Inter', sans-serif; box-sizing: border-box; background: #f8fafc; }
    .map-input:focus { outline: none; border-color: #22c55e; background: white; }
    .search-row { display: flex; gap: 8px; }
    .search-row .map-input { flex: 1; }
    .btn-find { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .btn-find:disabled { opacity: 0.6; cursor: not-allowed; }
    .geocode-ok { font-size: 12px; color: #22c55e; font-weight: 600; margin-top: 5px; display: none; }
    .geocode-err { font-size: 12px; color: #ef4444; font-weight: 600; margin-top: 5px; display: none; }
    .btn-add { width: 100%; background: #14532d; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 16px; }
    .btn-add:hover { background: #166534; }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 768px) {
      .maps-grid { grid-template-columns: 1fr; }
      #map { height: 300px; }
      .centers-panel { max-height: 280px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="maps-nav">
  <div class="logo">💚 Aidly</div>
  <div class="nav-right">
    <a href="dashboard.html" class="btn-back">← Back</a>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="maps-wrapper">
  <h1 class="page-title">📍 Donation Centers</h1>
  <p class="page-sub">Find the nearest donation center or pickup point in your area.</p>

  <div class="role-banner" id="roleBanner" style="display:none;"></div>

  <div class="maps-grid">
    <div id="map"></div>
    <div class="centers-panel">
      <div class="centers-header">
        <h3>Centers <span id="centerCount" style="font-weight:400; color:#64748b;"></span></h3>
        <p>Click a center to see it on the map</p>
      </div>
      <div class="centers-list" id="centersList">
        <div class="empty-panel">Loading centers...</div>
      </div>
    </div>
  </div>

  <!-- Admin add center -->
  <div id="addSection" style="display:none;">
    <div class="add-card">
      <h3>➕ Add New Donation Center</h3>
      <p>Type the address and click <strong>Find</strong> — no coordinates needed!</p>

      <div class="form-grid">
        <div>
          <label class="field-label">Center Name *</label>
          <input type="text" id="cName" class="map-input" placeholder="e.g. Tantra Hills Community Center">
        </div>
        <div>
          <label class="field-label">Phone Number</label>
          <input type="text" id="cPhone" class="map-input" placeholder="e.g. 0241234567">
        </div>
      </div>

      <div style="margin-top:12px;">
        <label class="field-label">Address * — type then click Find</label>
        <div class="search-row">
          <input type="text" id="cAddress" class="map-input" placeholder="e.g. Tantra Hills, Accra">
          <button class="btn-find" id="findBtn" onclick="findAddress()">📍 Find</button>
        </div>
        <p class="geocode-ok" id="gOk"></p>
        <p class="geocode-err" id="gErr"></p>
      </div>

      <div class="form-grid" style="margin-top:12px;">
        <div>
          <label class="field-label">Type</label>
          <select id="cType" class="map-input">
            <option value="donation_center">Donation Center</option>
            <option value="pickup_point">Pickup Point</option>
            <option value="distribution_center">Distribution Center</option>
          </select>
        </div>
        <div>
          <label class="field-label">Operating Hours</label>
          <input type="text" id="cHours" class="map-input" placeholder="e.g. Mon-Fri, 8AM-5PM">
        </div>
      </div>

      <button class="btn-add" id="addBtn" onclick="addCenter()">➕ Add Donation Center</button>
    </div>
  </div>
</div>

<!-- Leaflet JS - FREE -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script>
  const API_URL = window.API_URL || "https://aidly-q8i6.onrender.com/api";
  const token = localStorage.getItem("aidlyToken");
  const user = JSON.parse(localStorage.getItem("aidlyUser") || "{}");
  const role = (user.role || "").toLowerCase();

  function logout() { localStorage.clear(); window.location.href = "login.html"; }
  if (!token) window.location.href = "login.html";

  // Role banner
  const banners = {
    donor: { cls: "donor", msg: "🎁 As a donor, you can drop off physical items at any of these centers instead of waiting for a volunteer pickup." },
    recipient: { cls: "recipient", msg: "🤲 As a recipient, you can visit any center to collect available items directly without waiting for delivery." },
    volunteer: { cls: "volunteer", msg: "🚚 As a volunteer, these are your pickup points — collect donations here before delivering to recipients." },
    admin: { cls: "admin", msg: "🛡️ As admin, you can add new donation centers below. They appear on the map for all users." }
  };
  if (banners[role]) {
    const b = document.getElementById("roleBanner");
    b.className = `role-banner ${banners[role].cls}`;
    b.textContent = banners[role].msg;
    b.style.display = "block";
  }
  if (role === "admin") document.getElementById("addSection").style.display = "block";

  // Init Leaflet map (Accra centre)
  const map = L.map("map").setView([5.6037, -0.1870], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  // Custom green marker
  const greenIcon = L.divIcon({
    className: "",
    html: `<div style="width:28px;height:28px;background:#14532d;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;">
             <span style="color:white;font-size:12px;">📍</span>
           </div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16]
  });

  let markers = [];
  let centers = [];
  let geocodedCoords = null;
  let tempMarker = null;

  async function deleteCenter(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${API_URL}/locations/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        alert("✅ Center deleted!");
        loadCenters();
      } else {
        const d = await res.json();
        alert(d.error || d.message || "Failed to delete.");
      }
    } catch { alert("Connection error."); }
  }

  async function loadCenters() {
    try {
      const res = await fetch(`${API_URL}/locations`);
      if (!res.ok) throw new Error("Failed");
      const data = await res.json();
      centers = data.data || [];
      document.getElementById("centerCount").textContent = `(${centers.length})`;
      renderList();
      renderMarkers();
    } catch {
      document.getElementById("centersList").innerHTML = `<div class="empty-panel">Could not load centers.<br>Make sure your backend is running.</div>`;
    }
  }

  function renderList() {
    const list = document.getElementById("centersList");
    if (!centers.length) {
      list.innerHTML = `<div class="empty-panel">No centers yet.<br>${role === "admin" ? "Add one below!" : "Check back soon!"}</div>`;
      return;
    }
    const badgeClass = { donation_center: "badge-donation", pickup_point: "badge-pickup", distribution_center: "badge-distribution" };
    const typeLabel = { donation_center: "Donation Center", pickup_point: "Pickup Point", distribution_center: "Distribution Center" };
    list.innerHTML = centers.map((c, i) => `
      <div class="center-card" id="card-${i}" onclick="focusCenter(${i})">
        <h4>${c.name}</h4>
        <p>📍 ${c.address}</p>
        ${c.operatingHours ? `<p>🕐 ${c.operatingHours}</p>` : ""}
        ${c.contactPhone ? `<p>📞 ${c.contactPhone}</p>` : ""}
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
          <span class="type-badge ${badgeClass[c.type] || "badge-donation"}">${typeLabel[c.type] || "Center"}</span>
          ${role === "admin" ? `<button onclick="event.stopPropagation(); deleteCenter('${c._id}', '${c.name}')" style="background:#fef2f2; color:#ef4444; border:1px solid #fecaca; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">🗑️ Delete</button>` : ""}
        </div>
      </div>
    `).join("");
  }

  function renderMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    centers.forEach((c, i) => {
      const m = L.marker([c.gpsCoordinates.lat, c.gpsCoordinates.lng], { icon: greenIcon })
        .addTo(map)
        .bindPopup(`
          <strong style="font-size:14px;">${c.name}</strong><br>
          <span style="font-size:12px; color:#64748b;">📍 ${c.address}</span><br>
          ${c.operatingHours ? `<span style="font-size:12px; color:#64748b;">🕐 ${c.operatingHours}</span><br>` : ""}
          ${c.contactPhone ? `<span style="font-size:12px; color:#64748b;">📞 ${c.contactPhone}</span>` : ""}
        `);
      m.on("click", () => highlightCard(i));
      markers.push(m);
    });
  }

  function focusCenter(i) {
    const c = centers[i];
    map.setView([c.gpsCoordinates.lat, c.gpsCoordinates.lng], 16);
    markers[i].openPopup();
    highlightCard(i);
  }

  function highlightCard(i) {
    document.querySelectorAll(".center-card").forEach(el => el.classList.remove("active"));
    const card = document.getElementById(`card-${i}`);
    if (card) { card.classList.add("active"); card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  }

  // Geocode using OpenStreetMap Nominatim (FREE)
  async function findAddress() {
    const address = document.getElementById("cAddress").value.trim();
    if (!address) return showErr("Please enter an address first!");

    const btn = document.getElementById("findBtn");
    btn.textContent = "Finding..."; btn.disabled = true;
    document.getElementById("gOk").style.display = "none";
    document.getElementById("gErr").style.display = "none";
    geocodedCoords = null;

    try {
      const query = address.toLowerCase().includes("ghana") ? address : address + ", Ghana";
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`, {
        headers: { "Accept-Language": "en" }
      });
      const results = await res.json();

      if (results && results.length > 0) {
        const r = results[0];
        geocodedCoords = { lat: parseFloat(r.lat), lng: parseFloat(r.lon) };
        document.getElementById("cAddress").value = r.display_name;
        showOk(`✅ Found: ${r.display_name.split(",").slice(0, 3).join(",")}`);

        // Preview on map
        map.setView([geocodedCoords.lat, geocodedCoords.lng], 16);
        if (tempMarker) map.removeLayer(tempMarker);
        tempMarker = L.marker([geocodedCoords.lat, geocodedCoords.lng])
          .addTo(map)
          .bindPopup("📍 Selected location — click Add to confirm")
          .openPopup();
      } else {
        showErr("❌ Address not found. Try being more specific e.g. 'Tantra Hills, Accra, Ghana'");
      }
    } catch {
      showErr("❌ Search failed. Please check your internet connection.");
    }

    btn.textContent = "📍 Find"; btn.disabled = false;
  }

  function showOk(msg) { const el = document.getElementById("gOk"); el.textContent = msg; el.style.display = "block"; document.getElementById("gErr").style.display = "none"; }
  function showErr(msg) { const el = document.getElementById("gErr"); el.textContent = msg; el.style.display = "block"; document.getElementById("gOk").style.display = "none"; }

  async function addCenter() {
    const name = document.getElementById("cName").value.trim();
    const address = document.getElementById("cAddress").value.trim();
    const type = document.getElementById("cType").value;
    const operatingHours = document.getElementById("cHours").value.trim();
    const contactPhone = document.getElementById("cPhone").value.trim();

    if (!name) return alert("Please enter a center name!");
    if (!address) return alert("Please enter an address!");
    if (!geocodedCoords) return alert("Please click 📍 Find to locate the address first!");

    const btn = document.getElementById("addBtn");
    btn.textContent = "Adding..."; btn.disabled = true;

    try {
      const res = await fetch(`${API_URL}/locations`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ name, address, region: "Accra", gpsCoordinates: geocodedCoords, type, operatingHours, contactPhone })
      });

      if (res.ok) {
        alert("✅ Center added successfully!");
        document.getElementById("cName").value = "";
        document.getElementById("cAddress").value = "";
        document.getElementById("cPhone").value = "";
        document.getElementById("cHours").value = "";
        document.getElementById("gOk").style.display = "none";
        geocodedCoords = null;
        if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
        loadCenters();
      } else {
        const d = await res.json();
        alert(d.error || d.message || "Failed to add center.");
      }
    } catch { alert("Connection error. Is your backend running?"); }

    btn.textContent = "➕ Add Donation Center"; btn.disabled = false;
  }

  loadCenters();
</script>
</body>
</html>
