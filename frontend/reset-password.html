<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Aidly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">💚 Aidly</div>
  </header>

  <main class="container">
    <div class="donation-box" style="max-width: 460px; margin: 60px auto;">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="font-size:48px;">🔑</div>
        <h2 style="margin:8px 0 4px;">Set New Password</h2>
        <p style="color:#64748b; font-size:14px;">Enter your new password below.</p>
      </div>

      <div id="errorMsg" style="display:none; background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:14px; margin-bottom:16px; color:#ef4444; font-size:14px; text-align:center;"></div>

      <label style="font-weight:600; font-size:14px; display:block; margin-bottom:6px;">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password"
        style="width:100%; padding:12px; border-radius:10px; border:1px solid #e2e8f0; font-size:14px; box-sizing:border-box; margin-bottom:12px;">

      <label style="font-weight:600; font-size:14px; display:block; margin-bottom:6px;">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password"
        style="width:100%; padding:12px; border-radius:10px; border:1px solid #e2e8f0; font-size:14px; box-sizing:border-box; margin-bottom:16px;">

      <button onclick="resetPassword()" id="resetBtn"
        style="width:100%; background:#22c55e; color:white; border:none; padding:14px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;">
        Reset Password →
      </button>
    </div>
  </main>

  <script>
    // API_URL is set globally by config.js
const API_URL = window.API_URL || "https://aidly-q8i6.onrender.com/api";

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    if (!token) {
      document.getElementById("errorMsg").style.display = "block";
      document.getElementById("errorMsg").innerText = "Invalid reset link. Please request a new one.";
    }

    async function resetPassword() {
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const errorMsg = document.getElementById("errorMsg");

      if (!password || password.length < 6) {
        errorMsg.style.display = "block";
        errorMsg.innerText = "Password must be at least 6 characters!";
        return;
      }
      if (password !== confirm) {
        errorMsg.style.display = "block";
        errorMsg.innerText = "Passwords do not match!";
        return;
      }

      const btn = document.getElementById("resetBtn");
      btn.innerText = "Resetting..."; btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert("✅ Password reset successfully! Please login.");
          window.location.href = "login.html";
        } else {
          errorMsg.style.display = "block";
          errorMsg.innerText = data.message || "Reset failed. Try requesting a new link.";
          btn.innerText = "Reset Password →"; btn.disabled = false;
        }
      } catch (err) {
        toast("Connection error.", "error");
        btn.innerText = "Reset Password →"; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
